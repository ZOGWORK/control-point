<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Point</title>
    <link rel="icon" type="image/svg" href="src/assets/favicon.svg">
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply the saved theme before React mounts to avoid a dark flash. -->
    <script>
      try {
        if (localStorage.getItem('cp-theme') === 'light') document.documentElement.classList.add('light');
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
