    <!-- Link embeds: Discord, iMessage, Twitter/X, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Control Point" />
    <meta property="og:title" content="Control Point — AI-powered mission control for your robotics team" />

    <link rel="canonical" href="https://tryctrlpoint.org/" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Control Point" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply the saved theme before React mounts to avoid a dark flash. -->
    <script>
      try {
        var t = localStorage.getItem('cp-theme');
        if (t === 'light' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.add('light');
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
