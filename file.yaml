name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes, under Render's 15-min spindown
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Control Point
        run: curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://control-point.onrender.com/
